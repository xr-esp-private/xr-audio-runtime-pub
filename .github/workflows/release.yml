name: Release XR Audio Linux Basic

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact private source tag
        required: true
        default: v0.2.5
        type: string
      source_commit:
        description: Exact private source commit
        required: true
        default: 39223ecc86499458649a3120d802ffd7751a82f5
        type: string
      prerelease:
        description: Mark the GitHub Release as a prerelease
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
    uses: xr-esp-private/xr-release-workflows/.github/workflows/linux-deb-release.yml@219ea93831159e132d69bddc25ae93227b6c9b85
    with:
      workflow_implementation_commit: 219ea93831159e132d69bddc25ae93227b6c9b85
      source_repository: xr-esp-private/xr-audio-runtime
      source_tag: ${{ inputs.source_tag }}
      source_commit: ${{ inputs.source_commit }}
      source_manifest_path: packaging/release-manifest.json
      apt_repository_url: ${{ vars.XR_APT_REPOSITORY_URL }}
      apt_allow_plain_http: true
      # Publish this Basic product only to the shared stable/main index.
      apt_distribution: stable
      apt_component: main
      apt_signing_key_url: ${{ vars.XR_APT_SIGNING_KEY_URL }}
      apt_signing_key_fingerprint: ${{ vars.XR_APT_SIGNING_KEY_FINGERPRINT }}
      prerelease: ${{ inputs.prerelease }}
    secrets:
      XR_PRIVATE_SOURCE_SSH_KEY: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY }}
      XR_APT_REPO_URL: ${{ secrets.XR_APT_REPO_URL }}
      XR_APT_REPO_USER: ${{ secrets.XR_APT_REPO_USER }}
      XR_APT_REPO_PASS: ${{ secrets.XR_APT_REPO_PASS }}
