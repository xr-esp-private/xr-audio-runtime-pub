name: Validate XR Audio Linux Basic

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact private source tag
        required: true
        default: v0.2.3
        type: string
      source_commit:
        description: Exact private source commit
        required: true
        default: a720d64679dd9dd37db5ce7091b93f732d45a20c
        type: string

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: xr-esp-private/xr-release-workflows/.github/workflows/linux-deb-validate.yml@4beac4eeee9080359d97d9defd02899181fc09af
    with:
      workflow_implementation_commit: 4beac4eeee9080359d97d9defd02899181fc09af
      source_repository: xr-esp-private/xr-audio-runtime
      source_tag: ${{ inputs.source_tag }}
      source_commit: ${{ inputs.source_commit }}
      source_manifest_path: packaging/release-manifest.json
    secrets:
      XR_PRIVATE_SOURCE_SSH_KEY: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY }}
