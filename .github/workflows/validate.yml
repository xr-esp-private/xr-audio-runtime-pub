name: Validate XR Audio Linux Basic

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact private source tag
        required: true
        default: v0.2.6
        type: string
      source_commit:
        description: Exact private source commit
        required: true
        type: string
      source_manifest_path:
        description: Modern PipeWire or Legacy PulseAudio release manifest
        required: true
        default: packaging/release-manifest.json
        type: choice
        options:
          - packaging/release-manifest.json
          - packaging/release-manifest-legacy.json

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
    uses: xr-esp-private/xr-release-workflows/.github/workflows/linux-deb-validate.yml@08819029fdc1da9392be55c00d8bae73665bacf3
    with:
      workflow_implementation_commit: 08819029fdc1da9392be55c00d8bae73665bacf3
      source_repository: xr-esp-private/xr-audio-runtime
      source_tag: ${{ inputs.source_tag }}
      source_commit: ${{ inputs.source_commit }}
      source_manifest_path: ${{ inputs.source_manifest_path }}
    secrets:
      XR_PRIVATE_SOURCE_SSH_KEY: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY }}
