name: Build XR Audio Legacy Basic candidate

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: Exact private source RC tag (for example v0.1.0-rc.1)
        required: true
        type: string
      source_commit:
        description: Exact private source commit
        required: true
        type: string
      publish_candidate:
        description: Publish a GitHub prerelease only (no APT publication)
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: xr-legacy-candidate-${{ inputs.source_tag }}
  cancel-in-progress: false

jobs:
  validate:
    uses: xr-esp-private/xr-release-workflows/.github/workflows/linux-deb-validate.yml@08819029fdc1da9392be55c00d8bae73665bacf3
    with:
      workflow_implementation_commit: 08819029fdc1da9392be55c00d8bae73665bacf3
      source_repository: xr-esp-private/xr-audio-runtime
      source_tag: ${{ inputs.source_tag }}
      source_commit: ${{ inputs.source_commit }}
      source_manifest_path: packaging/release-manifest-legacy.json
    secrets:
      XR_PRIVATE_SOURCE_SSH_KEY: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY }}

  publish-candidate:
    needs: validate
    if: ${{ inputs.publish_candidate }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      SOURCE_REPOSITORY: xr-esp-private/xr-audio-runtime
      SOURCE_TAG: ${{ inputs.source_tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      SOURCE_MANIFEST_PATH: packaging/release-manifest-legacy.json
    steps:
      - name: Check out the reviewed release implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xr-esp-private/xr-release-workflows
          ref: 08819029fdc1da9392be55c00d8bae73665bacf3
          path: .xr-release-workflows
          persist-credentials: false

      - name: Check out the immutable source for public metadata only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: xr-esp-private/xr-audio-runtime
          ref: refs/tags/${{ inputs.source_tag }}
          ssh-key: ${{ secrets.XR_PRIVATE_SOURCE_SSH_KEY }}
          ssh-strict: true
          path: source
          persist-credentials: false

      - name: Recheck the exact source and release manifest
        run: |
          set -euo pipefail
          python3 .xr-release-workflows/scripts/prepare_source.py \
            --source-dir source --source-repository "$SOURCE_REPOSITORY" \
            --source-tag "$SOURCE_TAG" --source-commit "$SOURCE_COMMIT" \
            --manifest-path "$SOURCE_MANIFEST_PATH" \
            --metadata-dir release-metadata --github-output "$GITHUB_OUTPUT"

      - name: Download only the validated binary artifact set
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: validated-release
          path: dist

      - name: Recheck both architectures and checksums
        run: |
          set -euo pipefail
          python3 .xr-release-workflows/scripts/validate_release.py \
            --directory dist --packages-json '["xraudio-audio-defaults-legacy"]' \
            --version "${SOURCE_TAG#v}" --checksums-out dist/SHA256SUMS

      - name: Publish a byte-checked experimental prerelease, never APT
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .xr-release-workflows/scripts/github_release.py prepare \
            --dist dist --metadata release-metadata \
            --notes release-metadata/release-notes.md \
            --tag "$SOURCE_TAG" --target-commit "$TARGET_COMMIT" --prerelease
          python3 .xr-release-workflows/scripts/github_release.py finalize --tag "$SOURCE_TAG"
